<meta name="viewport" content="width=device-width,initial-scale=1"><title>رمز الجود والكرم</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbf5e8;font-family:Tahoma,Arial,sans-serif;color:#174f2a}
main{max-width:760px;margin:auto;padding:18px;text-align:center}h1{font-size:clamp(30px,7vw,50px);margin:10px 0 4px}
.intro{font-size:18px;font-weight:bold;margin:0 0 16px}.game{position:relative;min-height:560px;background:#fffaf0;border:2px solid #ddcea7;border-radius:28px;overflow:hidden}
.palm{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);font-size:340px;line-height:1}
.pick{position:absolute;width:76px;height:76px;border-radius:50%;border:6px solid #55751b;background:#fffdf7;color:#553814;font-size:28px;font-weight:900;cursor:pointer;z-index:2}
.p1{left:9%;top:28%}.p2{left:9%;top:47%}.p3{left:9%;top:66%}.p4{right:9%;top:28%}.p5{right:9%;top:47%}.p6{right:9%;top:66%}
#box{margin-top:18px;min-height:150px;border:3px solid #2c6b3e;border-radius:22px;background:#fff;padding:22px}
#q{font-size:clamp(21px,4.5vw,29px);font-weight:900;line-height:1.7;margin:0}
#pic{display:none;width:100%;max-width:620px;height:auto;margin:18px auto 0;border-radius:18px;border:2px solid #d8cba8}
.hint{color:#6b5a39;font-size:17px}.reset{margin-top:14px;border:0;border-radius:14px;background:#17652f;color:#fff;padding:13px 24px;font-size:18px;font-weight:bold}
.used{background:#e7e2d3;color:#777;border-color:#879274}
@media(max-width:520px){.game{min-height:500px}.palm{font-size:270px}.pick{width:64px;height:64px;font-size:23px;border-width:5px}.p1,.p2,.p3{left:4%}.p4,.p5,.p6{right:4%}}
